name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile agentfeed/*.py
      - run: python -m unittest discover -s tests -v
      - name: Serve smoke test
        run: |
          mkdir -p /tmp/web && echo ok > /tmp/web/index.html
          python -m agentfeed serve --web /tmp/web --port 8840 --fixture &
          sleep 1
          curl -sf http://127.0.0.1:8840/ | grep -q ok
          curl -sf http://127.0.0.1:8840/api/agents | python -c "import json,sys; d=json.load(sys.stdin); assert d['version']==1 and d['fixture']"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8840/../etc/passwd)" = 404
